name: Pages

# Publishes the example dashboards so the interactive HTML is viewable at a URL.
# configure-pages (enablement: true) turns Pages on automatically. Works on any public repo
# (Pages on a private repo needs GitHub Pro/Team).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples
      - id: deployment
        uses: actions/deploy-pages@v4
