name: Pages

# Publishes the example dashboards so the interactive HTML is viewable at a URL.
# Requires GitHub Pages to be enabled for the repo (Settings → Pages → Source: GitHub Actions).
# Note: Pages on a private repo needs GitHub Pro/Team; it works on any public repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples
      - id: deployment
        uses: actions/deploy-pages@v4
