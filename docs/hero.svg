<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Agentinel — MCP security scorecard</title>
  <desc>Agentinel scans GitHub's MCP server and flags a high-severity lethal trifecta: it reads untrusted issues and PRs, reads sensitive repo data, and can push and merge.</desc>

  <rect x="0" y="0" width="1200" height="600" fill="#0a0e14"/>
  <rect x="0" y="0" width="1200" height="4" fill="#22d3ee"/>

  <g transform="translate(56,50)">
    <path d="M16 2 L30 7 L30 16 C30 24 24 29 16 31 C8 29 2 24 2 16 L2 7 Z" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M7 16 C11 11 21 11 25 16 C21 21 11 21 7 16 Z" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="16" cy="16" r="3.2" fill="#22d3ee"/>
  </g>
  <text x="104" y="78" font-size="40" font-weight="700" fill="#eaf2fb">Agentinel</text>
  <text x="346" y="78" font-size="16" fill="#5f6b7a">v0.1.0</text>
  <text x="104" y="110" font-size="18" fill="#8b97a7">MCP security scanner &#183; OWASP Agentic Top 10 (2026)</text>

  <line x1="56" y1="142" x2="1144" y2="142" stroke="#1f2a37" stroke-width="1"/>

  <text x="56" y="180" font-size="13" font-weight="600" fill="#6b7787" letter-spacing="1.5">SCAN &#183; github mcp server</text>
  <text x="812" y="180" font-size="13" fill="#6b7787" text-anchor="middle">A</text>
  <text x="932" y="180" font-size="13" fill="#6b7787" text-anchor="middle">B</text>
  <text x="1052" y="180" font-size="13" fill="#6b7787" text-anchor="middle">C</text>

  <g font-size="19">
    <text x="72" y="226" fill="#c4cedb"><tspan fill="#a78bfa" font-weight="600">github</tspan> / list_issues</text>
    <circle cx="812" cy="220" r="7" fill="#38bdf8"/><circle cx="932" cy="220" r="7" fill="#2a3441"/><circle cx="1052" cy="220" r="7" fill="#2a3441"/>

    <text x="72" y="272" fill="#c4cedb"><tspan fill="#a78bfa" font-weight="600">github</tspan> / get_file_contents</text>
    <circle cx="812" cy="266" r="7" fill="#2a3441"/><circle cx="932" cy="266" r="7" fill="#fbbf24"/><circle cx="1052" cy="266" r="7" fill="#2a3441"/>

    <text x="72" y="318" fill="#c4cedb"><tspan fill="#a78bfa" font-weight="600">github</tspan> / get_secret_scanning_alert</text>
    <circle cx="812" cy="312" r="7" fill="#2a3441"/><circle cx="932" cy="312" r="7" fill="#fbbf24"/><circle cx="1052" cy="312" r="7" fill="#2a3441"/>

    <text x="72" y="364" fill="#c4cedb"><tspan fill="#a78bfa" font-weight="600">github</tspan> / push_files</text>
    <circle cx="812" cy="358" r="7" fill="#2a3441"/><circle cx="932" cy="358" r="7" fill="#fbbf24"/><circle cx="1052" cy="358" r="7" fill="#fb7185"/>

    <text x="72" y="410" fill="#c4cedb"><tspan fill="#a78bfa" font-weight="600">github</tspan> / create_pull_request</text>
    <circle cx="812" cy="404" r="7" fill="#38bdf8"/><circle cx="932" cy="404" r="7" fill="#2a3441"/><circle cx="1052" cy="404" r="7" fill="#fb7185"/>
  </g>

  <text x="56" y="448" font-size="13" fill="#5f6b7a">A untrusted-input &#160;&#183;&#160; B sensitive-access &#160;&#183;&#160; C external-comms</text>

  <rect x="56" y="474" width="1088" height="84" rx="10" fill="#12181f" stroke="#2a3441" stroke-width="1"/>
  <rect x="56" y="474" width="4" height="84" fill="#ff7a45"/>
  <rect x="78" y="492" width="58" height="26" rx="6" fill="#ff7a45"/>
  <text x="107" y="510" font-size="13" font-weight="700" fill="#0a0e14" text-anchor="middle">HIGH</text>
  <text x="152" y="510" font-size="19" font-weight="600" fill="#eaf2fb">Lethal Trifecta &#8212; reads untrusted issues/PRs, reads private repo, and can push/merge</text>
  <text x="152" y="538" font-size="14" fill="#8b97a7">ASI02 &#183; Tool Misuse &#183; the same lethal trifecta disclosed in the real GitHub MCP exploit</text>
  <text x="1120" y="514" font-size="13" fill="#5f6b7a" text-anchor="end">A&#183;B&#183;C</text>

  <text x="56" y="586" font-size="13" fill="#46505e">github.com/markusweldon/agentinel</text>
</svg>
