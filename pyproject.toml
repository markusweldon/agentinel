[project]
name = "agentinel"
dynamic = ["version", "readme"]
description = "Audit MCP servers and agent fleets for the lethal trifecta, tool poisoning, and leaked secrets, mapped to the OWASP Agentic Top 10 (2026)."
authors = [{ name = "Markus Weldon" }]
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "owasp",
    "agentic-ai",
    "red-team",
    "prompt-injection",
    "ai-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.20,<2",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "truststore>=0.8",
]

[project.urls]
Homepage = "https://github.com/markusweldon/agentinel"
Repository = "https://github.com/markusweldon/agentinel"
Issues = "https://github.com/markusweldon/agentinel/issues"
Changelog = "https://github.com/markusweldon/agentinel/blob/main/CHANGELOG.md"

[project.scripts]
agentinel = "agentinel.cli:main"
agentinel-mcp = "agentinel.server:main"
agentinel-guard = "agentinel.guard.hook:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentinel/__init__.py"

# PyPI can't resolve the README's relative links, so point images at raw files and links at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/markusweldon/agentinel/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/markusweldon/agentinel/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/markusweldon/agentinel/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/agentinel"]

[tool.hatch.build.targets.sdist]
include = ["/src/agentinel", "/tests", "/fixtures", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# The HTML scorecard is a single embedded template; long CSS/markup lines are expected.
"src/agentinel/report/html.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
